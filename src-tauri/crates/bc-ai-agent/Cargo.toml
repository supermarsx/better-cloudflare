[package]
name = "bc-ai-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
bc-ai-provider = { path = "../bc-ai-provider" }
bc-ai-chat = { path = "../bc-ai-chat" }
bc-ai-tools = { path = "../bc-ai-tools" }
bc-mcp = { path = "../bc-mcp" }
# For `is_valid_hostname`: a registry link and a registry lookup must agree on
# what a domain is, so both use the one definition. Already in the tree
# through bc-mcp; this only makes the dependency visible where it is used.
bc-notify = { path = "../bc-notify" }
# The application's audit trail. The assistant's tool calls belong in the same
# record as the user's own edits and the MCP server's, so a user can read one
# ordered account rather than reconciling three.
bc-storage = { path = "../bc-storage" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
