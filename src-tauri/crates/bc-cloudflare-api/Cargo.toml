[package]
name = "bc-cloudflare-api"
version = "0.1.0"
edition = "2021"
description = "Cloudflare REST API client for Better Cloudflare"

[dependencies]
# TLS is pinned to native-tls deliberately. reqwest 0.13 kept the `default-tls`
# feature name but redefined it from native-tls to rustls + aws-lc, so leaving
# defaults on would silently relink the binary and swap the trust store. The
# rest of 0.12's default set is restated by hand for the same reason.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
