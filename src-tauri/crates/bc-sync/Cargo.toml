[package]
name = "bc-sync"
version = "0.1.0"
edition = "2021"
description = "Cloud sync for Better Cloudflare's API key vault: WebDAV/Nextcloud and Google Drive engines, sealed payload, generation-guarded writes"

[dependencies]
async-trait = "0.1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
# TLS is pinned to native-tls deliberately. reqwest 0.13 kept the `default-tls`
# feature name but redefined it from native-tls to rustls + aws-lc, so leaving
# defaults on would silently relink the binary and swap the trust store. The
# rest of 0.12's default set is restated by hand for the same reason. Matches
# every other HTTP-speaking crate in this workspace.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
url = "2"

[dev-dependencies]
# `net` and `io-util` serve the one-shot HTTP stubs the engine tests run
# against: a generation guard and a redirect bound can only be pinned against
# a real socket, and a test server is cheaper than a second HTTP dependency.
# The same reasoning, and the same feature set, as `bc-notify`'s RDAP tests.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
