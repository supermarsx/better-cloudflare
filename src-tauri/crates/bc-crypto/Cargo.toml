[package]
name = "bc-crypto"
version = "0.1.0"
edition = "2021"
description = "PBKDF2 + AES-256-GCM encryption primitives for Better Cloudflare"

[dependencies]
aes-gcm = "0.10"
base64 = { version = "0.23", default-features = false, features = ["std"] }
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
