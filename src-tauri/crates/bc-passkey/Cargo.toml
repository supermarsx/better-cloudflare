[package]
name = "bc-passkey"
version = "0.1.0"
edition = "2021"
description = "WebAuthn passkey registration, authentication, and token management"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bc-storage = { path = "../bc-storage" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
