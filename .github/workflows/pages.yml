name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.enabled }}
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages base path
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          echo "GITHUB_PAGES_BASE_PATH=$repo_name" >> "$GITHUB_ENV"
      - name: Check GitHub Pages site exists
        id: check-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status_code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status_code" -eq 200 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages site is available."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages site is not configured for this repository. Skipping deployment."
          fi
      - name: Build export
        if: steps.check-pages.outputs.enabled == 'true'
        run: npm run build
      - name: Setup Pages
        if: steps.check-pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload artifact
        if: steps.check-pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
