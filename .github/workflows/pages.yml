name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Detect optional Pages administration token
        id: admin_token
        env:
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$PAGES_ADMIN_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable GitHub Pages for Actions
        id: enable_pages
        if: steps.pages.outcome == 'failure' && steps.admin_token.outputs.available == 'true'
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          token: ${{ secrets.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Require a configured GitHub Pages site
        if: steps.pages.outcome == 'failure' && steps.enable_pages.outcome != 'success'
        shell: bash
        run: |
          echo "::error title=GitHub Pages configuration required::GitHub Pages is not configured for Actions. A repository administrator must set Settings > Pages > Build and deployment > Source to 'GitHub Actions', or add a PAGES_ADMIN_TOKEN repository secret that can manage Pages. A fine-grained token needs Pages: write and Administration: write permissions."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project-path export
        run: npm run build:pages:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify project-path static export
        run: npm run test:e2e:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
