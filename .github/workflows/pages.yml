name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      UV_THREADPOOL_SIZE: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Report runner capacity
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: node .github/scripts/release-contract.mjs diagnostics 1536 8192

      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: npm ci --no-audit --no-fund

      - name: Build project-path export
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run build:pages:ci

      - name: Install Playwright Chromium
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: npx playwright install --with-deps chromium

      - name: Verify project-path static export
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: npm run test:e2e:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages deployment
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
