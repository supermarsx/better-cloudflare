name: Native Release

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full commit SHA that passed every required CI gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Validate release contract
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Test release contract
        run: node --test .github/scripts/release-contract.test.mjs
      - name: Generate native build matrix
        id: matrix
        run: node .github/scripts/release-contract.mjs matrix >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - name: Verify native runner architecture
        run: >-
          node .github/scripts/release-contract.mjs verify-runner
          ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Install stable Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils
      - name: Install JavaScript dependencies
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        run: npm ci --no-audit --no-fund
      - name: Install JavaScript dependencies without lifecycle scripts (Windows ARM64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build native Tauri bundle
        run: >-
          npm run tauri -- build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundle }}
      - name: Stage deterministic native asset
        run: >-
          node .github/scripts/release-contract.mjs stage
          target/${{ matrix.target }}/release/bundle
          ${{ matrix.platform }} ${{ matrix.arch }} release-assets
      - name: Upload native asset and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify and publish native release
    needs:
      - contract
      - build
    if: needs.contract.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: native-release-publish-${{ github.repository }}-${{ inputs.commit_sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout release commit with complete tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Download all native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Require all six native assets and valid checksums
        run: node .github/scripts/release-contract.mjs validate release-assets
      - name: Atomically reserve the next YY.N tag
        id: tag
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: node .github/scripts/release-contract.mjs reserve-tag "$RELEASE_SHA"
      - name: Upload a complete draft, verify it, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' \
                | node .github/scripts/release-contract.mjs validate-names
              echo "::notice::Release $RELEASE_TAG is already complete and published."
              exit 0
            fi
          else
            short_sha="${RELEASE_SHA:0:7}"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Better Cloudflare $RELEASE_TAG" \
              --notes "Automated native release for commit \`$short_sha\`. Includes Linux, macOS, and Windows installers for x64 and arm64, with SHA-256 checksums."
          fi

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | node .github/scripts/release-contract.mjs validate-names

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
