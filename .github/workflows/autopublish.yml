name: Native Release

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full commit SHA that passed every required CI gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Validate release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 1024 4096
      - name: Test release contract
        run: >-
          node --test --test-concurrency=1
          .github/scripts/release-contract.test.mjs
      - name: Require release commit to remain current main
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: node .github/scripts/release-contract.mjs assert-main "$RELEASE_SHA"
      - name: Generate native build matrix
        id: matrix
        run: node .github/scripts/release-contract.mjs matrix >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --max-old-space-size=3072
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 2048 8192
      - name: Verify native runner architecture
        run: >-
          node .github/scripts/release-contract.mjs verify-runner
          ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Install stable Rust target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add ${{ matrix.target }}
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils
      - name: Install JavaScript dependencies
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        run: npm ci --no-audit --no-fund
      - name: Install JavaScript dependencies without lifecycle scripts (Windows ARM64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build native Tauri bundle
        run: >-
          npm run tauri -- build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
      - name: Verify packaged application executable architecture
        run: >-
          node .github/scripts/release-contract.mjs verify-executable
          target/${{ matrix.target }}/release/${{ matrix.executable }}
          ${{ matrix.platform }} ${{ matrix.arch }}
      # Flatpak is not a Tauri bundler target. Wrap the .deb this job just
      # built, then drop the single-file bundle where the staging step looks
      # for it. The sandboxed build itself is offline; only the runtime and
      # SDK are downloaded, by the step above it.
      - name: Install Flatpak tooling
        if: matrix.flatpak
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build Flatpak bundle
        if: matrix.flatpak
        shell: bash
        env:
          BUNDLE_DIRECTORY: target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp .github/flatpak/com.bettercloudflare.app.yml "$work/"

          debian_package="$(find "$BUNDLE_DIRECTORY/deb" -maxdepth 1 -type f -name '*.deb')"
          if [ "$(printf '%s\n' "$debian_package" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one .deb to wrap as a Flatpak."
            exit 1
          fi
          cp "$debian_package" "$work/better-cloudflare.deb"

          flatpak-builder --user --disable-cache --force-clean \
            --repo="$work/repo" \
            "$work/build" \
            "$work/com.bettercloudflare.app.yml"

          mkdir -p "$BUNDLE_DIRECTORY/flatpak"
          flatpak build-bundle "$work/repo" \
            "$BUNDLE_DIRECTORY/flatpak/better-cloudflare.flatpak" \
            com.bettercloudflare.app
      - name: Stage deterministic native assets
        run: >-
          node .github/scripts/release-contract.mjs stage
          target/${{ matrix.target }}/release/bundle
          ${{ matrix.platform }} ${{ matrix.arch }}
          release-assets/${{ matrix.platform }}-${{ matrix.arch }}
          target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Attest native asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/${{ matrix.platform }}-${{ matrix.arch }}/*
      - name: Upload native assets and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/${{ matrix.platform }}-${{ matrix.arch }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Verify and publish native release
    needs:
      - contract
      - build
    if: needs.contract.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: native-release-publish-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: production-release
    permissions:
      contents: write
      attestations: read
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - name: Checkout release commit with complete tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 1024 4096
      - name: Download all native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release-artifacts
          merge-multiple: false
      - name: Validate isolated platform artifacts
        run: >-
          node .github/scripts/release-contract.mjs aggregate
          release-artifacts release-assets
      - name: Require every native asset and valid checksums
        run: node .github/scripts/release-contract.mjs validate release-assets
      - name: Require release commit to remain current main
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: node .github/scripts/release-contract.mjs assert-main "$RELEASE_SHA"
      - name: Verify build provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in release-assets/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/autopublish.yml" \
              --signer-digest "$RELEASE_SHA" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/heads/main"
          done
      - name: Atomically reserve the next YY.N tag
        id: tag
        env:
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: node .github/scripts/release-contract.mjs reserve-tag "$RELEASE_SHA"
      - name: Upload a complete draft, verify it, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          verify_tag_and_metadata() {
            local state="$1"
            node .github/scripts/release-contract.mjs verify-tag \
              "$RELEASE_TAG" "$RELEASE_SHA"
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,targetCommitish,isDraft \
              | node .github/scripts/release-contract.mjs \
                validate-release-json "$RELEASE_TAG" "$RELEASE_SHA" "$state"
          }

          verify_downloaded_release() {
            local directory="$1"
            node .github/scripts/release-contract.mjs validate "$directory"
            for local_asset in release-assets/*; do
              asset_name="$(basename "$local_asset")"
              cmp -- "$local_asset" "$directory/$asset_name"
              gh attestation verify "$directory/$asset_name" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/autopublish.yml" \
                --signer-digest "$RELEASE_SHA" \
                --source-digest "$RELEASE_SHA" \
                --source-ref "refs/heads/main"
            done
          }

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              verify_tag_and_metadata published
              mkdir published-assets
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --dir published-assets
              verify_downloaded_release published-assets
              echo "::notice::Release $RELEASE_TAG is already byte-for-byte complete, attested, and published."
              exit 0
            fi
            verify_tag_and_metadata draft
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          else
            node .github/scripts/release-contract.mjs verify-tag \
              "$RELEASE_TAG" "$RELEASE_SHA"
          fi

          short_sha="${RELEASE_SHA:0:7}"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --draft \
            --title "Better Cloudflare $RELEASE_TAG" \
            --notes "Automated native release for commit \`$short_sha\`, for x64 and arm64. Linux: AppImage, .deb, .rpm and Flatpak. macOS: .dmg. Windows: NSIS setup, .msi, and a portable .exe that needs the Microsoft Edge WebView2 runtime already installed. Every asset carries a SHA-256 checksum and a GitHub build-provenance attestation. Executables are not yet platform code-signed."

          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY"

          verify_tag_and_metadata draft
          mkdir uploaded-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir uploaded-assets
          verify_downloaded_release uploaded-assets

          verify_tag_and_metadata draft
          node .github/scripts/release-contract.mjs assert-main "$RELEASE_SHA"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          verify_tag_and_metadata published

      - name: Recover a failed draft and newly reserved tag
        if: ${{ failure() && steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ steps.tag.outputs.created }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Refusing cleanup because $RELEASE_TAG is already published."
              exit 1
            fi
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,targetCommitish,isDraft \
              | node .github/scripts/release-contract.mjs \
                validate-release-json "$RELEASE_TAG" "$RELEASE_SHA" draft
            node .github/scripts/release-contract.mjs verify-tag \
              "$RELEASE_TAG" "$RELEASE_SHA"
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          fi

          node .github/scripts/release-contract.mjs cleanup-tag \
            "$RELEASE_SHA" "$RELEASE_TAG" "$RELEASE_CREATED"
