name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  osv:
    name: OSV lockfile scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate fail-closed OSV exception policy
        run: >-
          python3 .github/scripts/validate-osv-policy.py
          --config=./osv-scanner.toml
          --lockfile=./package-lock.json
          --lockfile=./Cargo.lock
          --workflow=./.github/workflows/ci.yml
          --workflow=./.github/workflows/security.yml
      - name: Scan JavaScript and Rust lockfiles
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:48406c58197201fe55e56615ad9d414f85063da320e204d0b0ed460fb3908dba # v2.3.8
        with:
          args: >-
            --config=./osv-scanner.toml
            --lockfile=./package-lock.json
            --lockfile=./Cargo.lock

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAURI_CONFIG: '{"build":{"frontendDist":"../app"}}'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with Clippy
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
      - name: Install Linux Tauri dependencies
        if: matrix.language == 'rust'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          threads: 2
          ram: 4096
      - name: Check Rust workspace before analysis
        if: matrix.language == 'rust'
        id: rust_preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rust-codeql"
          cargo check --workspace --all-targets --locked --jobs 1 2>&1 |
            tee "$RUNNER_TEMP/rust-codeql/cargo-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/rust-codeql/cargo-check.completed"
      - name: Assert Rust preflight completion
        if: ${{ matrix.language == 'rust' && always() }}
        shell: bash
        run: |
          test "${{ steps.rust_preflight.outcome }}" = "success"
          test "$(cat "$RUNNER_TEMP/rust-codeql/cargo-check.completed")" = "$GITHUB_SHA"
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          threads: 2
          ram: 4096
      - name: Upload Rust scan diagnostics
        if: ${{ matrix.language == 'rust' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-codeql-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rust-codeql/
            ${{ runner.temp }}/codeql-results/rust.sarif
          if-no-files-found: warn
          retention-days: 7
