name: Test and Package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Run web build
        run: npm run build
      - name: Create npm package
        run: npm pack
      - name: Upload npm package for CI inspection only
        uses: actions/upload-artifact@v7
        with:
          name: web-npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 7
