name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Run all gates and publish the selected main-branch commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit tests (${{ matrix.driver }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        driver:
          - default
          - sqlite3-only
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Remove better-sqlite3 to simulate fallback
        if: matrix.driver == 'sqlite3-only'
        run: npm uninstall better-sqlite3 --no-save || rm -rf node_modules/better-sqlite3
      - name: Run unit tests
        run: npm test

  format:
    name: Format Check
    uses: ./.github/workflows/format.yml
    permissions:
      contents: read

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test_package:
    name: Test and Package
    uses: ./.github/workflows/test-package.yml
    permissions:
      contents: read

  release_contract:
    name: Release workflow contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Test release contract
        run: node --test .github/scripts/release-contract.test.mjs

  release:
    name: Native Release
    needs:
      - unit_tests
      - format
      - lint
      - test_package
      - release_contract
    if: >-
      needs.unit_tests.result == 'success' &&
      needs.format.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test_package.result == 'success' &&
      needs.release_contract.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'supermarsx/better-cloudflare' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    uses: ./.github/workflows/autopublish.yml
    with:
      commit_sha: ${{ github.sha }}
    permissions:
      contents: write
