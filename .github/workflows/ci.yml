name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Run all gates and publish the selected main-branch commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci_contract:
    name: CI reliability contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      UV_THREADPOOL_SIZE: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 1024 4096
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test CI reliability contract
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:ci-contract -- --test-concurrency=1
      - name: Test deterministic resource disposal
        run: npm run test:resource-safety -- --test-concurrency=1

  unit_tests:
    name: Unit tests (${{ matrix.driver }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      UV_THREADPOOL_SIZE: "2"
    strategy:
      fail-fast: false
      matrix:
        driver:
          - default
          - sqlite3-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 1024 4096
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Remove better-sqlite3 to simulate fallback
        if: matrix.driver == 'sqlite3-only'
        run: npm uninstall better-sqlite3 --no-save || rm -rf node_modules/better-sqlite3
      - name: Run unit tests
        run: npm test -- --test-concurrency=1

  e2e_reliability:
    name: Chromium reliability E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      UV_THREADPOOL_SIZE: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 1536 8192
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static export for browser tests
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium reliability specifications
        run: npm run test:e2e:reliability
      - name: Bound Playwright failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test-results/playwright ]; then
            find test-results/playwright -type f -size +25M -print -delete
            evidence_kib="$(du -sk test-results/playwright | cut -f1)"
            if [ "$evidence_kib" -gt 102400 ]; then
              echo "::warning::Playwright evidence exceeded 100 MiB and will not be uploaded."
              rm -rf test-results/playwright
            fi
          fi
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-reliability-failures
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  native_reliability:
    name: Rust workspace reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      TAURI_CONFIG: '{"build":{"frontendDist":"../app"}}'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with Clippy
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1
      - name: Install Linux Tauri dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked
      - name: Run incremental workspace Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Enforce strict Clippy for native error contracts
        run: >-
          cargo clippy
          -p bc-error
          -p bc-cloudflare-api
          --all-targets
          --locked
          --
          -D warnings

  format:
    name: Format Check
    uses: ./.github/workflows/format.yml
    permissions:
      contents: read

  lint:
    name: App and source baseline lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test_package:
    name: Test and Package
    uses: ./.github/workflows/test-package.yml
    permissions:
      contents: read

  release_contract:
    name: Release workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Report runner capacity
        run: node .github/scripts/release-contract.mjs diagnostics 1024 4096
      - name: Test release contract
        run: npm run test:release-contract -- --test-concurrency=1
      - name: Scan JavaScript and Rust lockfiles for known vulnerabilities
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:48406c58197201fe55e56615ad9d414f85063da320e204d0b0ed460fb3908dba # v2.3.8
        with:
          args: >-
            --lockfile=./package-lock.json
            --lockfile=./Cargo.lock

  release:
    name: Native Release
    needs:
      - ci_contract
      - unit_tests
      - e2e_reliability
      - native_reliability
      - format
      - lint
      - test_package
      - release_contract
    if: >-
      needs.ci_contract.result == 'success' &&
      needs.unit_tests.result == 'success' &&
      needs.e2e_reliability.result == 'success' &&
      needs.native_reliability.result == 'success' &&
      needs.format.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test_package.result == 'success' &&
      needs.release_contract.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'supermarsx/better-cloudflare' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    uses: ./.github/workflows/autopublish.yml
    with:
      commit_sha: ${{ github.sha }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
